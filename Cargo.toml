[package]
name = "brim"
version = "0.2.0"
edition = "2021"
license = "GPL-2.0-only"
repository = "https://github.com/b4lol/brim"

[[bin]]
name = "brim"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "sync", "time", "process", "io-util", "fs"] }
clap = { version = "4.6.4", features = ["derive"] }
colored = "3.1.1"
indicatif = "0.18.6"
libc = "0.2.189"
unicode-width = "0.2"
async-channel = "2.5.0"
gtk4 = { version = "0.11.4", features = ["v4_10"] }
libadwaita = { version = "0.9.2", features = ["v1_5"] }
bytes = "1.12.1"
http-body-util = "0.1.4"
hyper = { version = "1.11.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.20", features = ["tokio"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
