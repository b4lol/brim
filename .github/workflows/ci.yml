name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, Monday 07:17 UTC — picks up newly published RUSTSEC advisories.
    - cron: '17 7 * * 1'

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: fmt, clippy, test, build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GTK4 and Libadwaita development packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Release build
        run: cargo build --release

  audit:
    name: security (RUSTSEC) + license audit
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-audit and cargo-deny
        run: cargo install cargo-audit cargo-deny --locked

      - name: RUSTSEC vulnerability check
        run: cargo audit

      - name: Dependency license check
        run: cargo deny check licenses

  dependency-review:
    name: dependency review (PR)
    runs-on: ubuntu-24.04
    # Only PRs change the dependency set relative to a base ref; pushes to
    # main are already covered by the RUSTSEC + license audit job.
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: moderate
